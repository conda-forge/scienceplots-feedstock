schema_version: 1

context:
  name: scienceplots
  version: "2.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d46ce7170b4160265c777a48f73a0db1fdff8460f59a0ded0e364acb139ab115

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - matplotlib-base
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base

tests:
  - python:
      imports:
        - scienceplots
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - python -c "import matplotlib.pyplot as plt; import scienceplots; plt.style.use('science')"

about:
  license: MIT
  license_file: LICENSE
  summary: Matplotlib styles for scientific plotting
  description: |
    This repo has Matplotlib styles to format your figures for scientific
    papers, presentations and theses.
  homepage: https://github.com/garrettj403/SciencePlots/
  repository: https://github.com/garrettj403/SciencePlots/
  documentation: https://github.com/garrettj403/SciencePlots/

extra:
  recipe-maintainers:
    - jan-janssen
